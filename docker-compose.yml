services:
  web:
    image: guitarrapc/jmeter-gui:latest
    tty: true
    ports:
      - ${WEB_PORT:-5900}:5900

  couchdb:
    image: couchdb:3.5
    container_name: couchdb
    restart: always
    user: 5984:5984
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-password}
    healthcheck:
      test: ["CMD", "curl", "-u", "health:health", "http://127.0.0.1:5984/_up"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s


  openssl:
    image: alpine/openssl
    container_name: openssl
    restart: always
    entrypoint: []
    command: echo $CERT | openssl x509 -text -noout
    environment:
      SSL_CERT: ${CERT:-}